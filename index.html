<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>SmartERP — Business, in balance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="auth-root"></div>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="SmartERP home"><span class="brand-mark"><i></i><i></i><i></i></span><span>smart<span class="brand-bold">erp</span></span></a>
      <div class="company-switch" id="company-switch"><div class="company-avatar">N</div><div class="company-meta"><b id="company-name">Northstar Goods</b><span>FY 2025–26</span></div><span class="switch-chevron">⌄</span></div>
      <nav class="main-nav" aria-label="Main navigation">
        <span class="nav-label">WORKSPACE</span>
        <button class="nav-item active" data-page="home"><span class="nav-icon">▦</span>Overview <kbd>⌘1</kbd></button>
        <button class="nav-item" data-page="vouchers"><span class="nav-icon">⇄</span>Vouchers <span class="nav-count" id="voucher-count">0</span></button>
        <span class="nav-label nav-label-spaced">MASTERS</span>
        <button class="nav-item" data-page="customers"><span class="nav-icon">♙</span>Customers</button>
        <button class="nav-item" data-page="suppliers"><span class="nav-icon">♧</span>Suppliers</button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">▤</span>Items & stock</button>
        <span class="nav-label nav-label-spaced">INSIGHTS</span>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>Reports</button>
      </nav>
      <div class="sidebar-bottom"><div class="help-card"><div class="help-spark">✳</div><b>Need a hand?</b><p>Press <kbd>?</kbd> to see keyboard shortcuts.</p><button id="shortcuts-link">View shortcuts <span>↗</span></button></div><div class="profile"><div class="profile-avatar" id="profile-avatar">U</div><div class="profile-copy"><b id="profile-name">Account</b><span id="profile-email">Signed in</span></div><button class="signout-button" id="logout-button" aria-label="Sign out">Sign out</button></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>Northstar Goods</span><span class="crumb-sep">/</span><b id="breadcrumb-current">Overview</b></div><div class="top-actions"><div class="search-wrap"><span>⌕</span><input id="global-search" placeholder="Search anything..." aria-label="Search anything" /><kbd>⌘ K</kbd></div><button class="icon-button" id="help-button" aria-label="Keyboard shortcuts">?</button><button class="icon-button notification" aria-label="Notifications">♧<i></i></button><div class="top-avatar" id="top-avatar">U</div></div></header>
      <div id="page-content" class="page-content"></div>
    </main>
  </div>
  <div id="modal-root"></div><div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
