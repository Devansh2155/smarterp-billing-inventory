services:
  - type: web
    name: smarterp-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smarterp-db
          property: connectionString

databases:
  - name: smarterp-db
    plan: free
    databaseName: smarterp
    user: smarterp

